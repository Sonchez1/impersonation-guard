<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="guard-protected" content="northfieldstate.edu,Northfield State University,NSU">
  <meta property="og:site_name" content="Northfield State University">
  <title>Northfield State University · Identity verification</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1f2937; background: #0b2a4a; min-height: 100vh; display: grid; place-items: center; }
    .card { background: #fff; width: 420px; max-width: 94vw; border-radius: 12px; padding: 28px 30px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .logo img { width: 40px; height: 40px; border-radius: 8px; background: #c8102e; }
    h1 { font-size: 20px; margin: 0; }
    .sub { color: #6b7280; margin: 0 0 18px; font-size: 13.5px; }
    label { display: grid; gap: 4px; margin-bottom: 12px; font-size: 13px; color: #374151; }
    input { font: inherit; padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 8px; }
    button { font: inherit; width: 100%; padding: 10px; border-radius: 8px; border: none; background: #c8102e; color: #fff; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .pretend { margin-top: 16px; width: 100%; background: #111827; font-weight: 500; font-size: 13px; }
    .fine { color: #9ca3af; font-size: 12px; margin: 12px 0 0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo"><img alt="Northfield State University" src="data:image/gif;base64,R0lGODlhAQABAIAAAMgQLgAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw=="><h1>Northfield State University</h1></div>
    <p class="sub">Identity verification for tax reporting</p>
    <form id="verify" action="#" method="post">
      <label>University email <input type="email" name="email" autocomplete="username" placeholder="you@northfieldstate.edu"></label>
      <label>Password <input type="password" name="password" autocomplete="current-password"></label>
      <label>Enter the 6-digit verification code <input type="text" name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456"></label>
      <button type="submit">Complete verification</button>
    </form>
    <button class="pretend" type="button" onclick="alert('Demo only. The guard treats this page as if its address were link.northfieldstat.edu, one letter off from northfieldstate.edu.')">This page pretends to be at link.northfieldstat.edu</button>
    <p class="fine">Demo page served from localhost. No data is sent anywhere.</p>
  </main>
  <script>window.__guardDemoHost = "link.northfieldstat.edu";</script>
  <script src="/packages/extension/dist/demo.js"></script>
</body>
</html>
